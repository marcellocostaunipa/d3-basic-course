<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lesson 13 — Bubble Map</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>Lesson 13 — Bubble Map</h1>
      <p>World GeoJSON + bubbles + time slider (D3.js)</p>
    </header>

    <section class="controls" aria-label="controls">
      <label class="control">
        <span>Year:</span>
        <strong id="year-label">—</strong>
      </label>

      <input
        id="year-slider"
        type="range"
        min="0"
        max="0"
        step="1"
        value="0"
        aria-label="Year slider"
      />
    </section>

    <section id="viz" class="viz"></section>

    <div id="tooltip" class="tooltip" style="opacity: 0;"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
